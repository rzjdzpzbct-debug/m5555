<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>سكينة | مشغل القرآن</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="backdrop"></div>
<main class="page">
  <header class="top"><span class="mark">۞</span><div><h1>سَكِينَة</h1><p>صوتٌ يطمئنّ به القلب</p></div></header>
  <section class="player" aria-label="مشغل القرآن">
    <div class="art" id="art">
      <div class="art-glow"></div>
      <div class="quran-symbol">۞</div>
      <div class="art-caption">وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</div>
    </div>
    <div class="trackline"><div><span class="eyebrow">التلاوة الحالية</span><h2 id="trackTitle">تلاوة قرآنية</h2></div><span class="dots">••••••</span></div>
    <div class="progress-wrap"><input id="seek" type="range" min="0" max="100" value="0" aria-label="تقدم التلاوة"><div class="times"><span id="current">--:--</span><span id="duration">--:--</span></div></div>
    <div class="controls">
      <button id="prev" class="skip" aria-label="التلاوة السابقة">⏮</button>
      <button id="play" class="play" aria-label="تشغيل أو إيقاف">▶</button>
      <button id="next" class="skip" aria-label="التلاوة التالية">⏭</button>
    </div>
    <div class="volume-row"><span class="speaker">◖))</span><input id="volume" type="range" min="0" max="100" value="70" aria-label="مستوى الصوت"><span class="speaker">◖</span></div>
    <div class="cast">◉ <span>البث السريع</span></div>
    <div class="status" id="status">متوقف</div>
    <div class="selector"><button class="active" data-track="0">التلاوة الأولى</button><button data-track="1">التلاوة الثانية</button></div>
    <div class="youtube" id="youtubeWrap">
      <iframe id="yt" title="مشغل تلاوة القرآن من يوتيوب" src="https://www.youtube.com/embed/3xRgDPRvH0o?enablejsapi=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <p>إذا لم يبدأ الصوت، اضغط تشغيل داخل مشغل يوتيوب.</p>
    </div>
  </section>
  <footer>اللهم اجعل القرآن ربيع قلوبنا</footer>
</main>
<script src="script.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
